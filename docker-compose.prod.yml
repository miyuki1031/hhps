# 本番
#
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "127.0.0.1:3000:3000"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/hhps:ro
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose: [ "3000" ]
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    #   - /app/.next
    env_file:
      - .env.prod
  # DB 
  db:
    image: postgres:17-alpine
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
