# 本番
# 
services:
  frontend:
    command: sh -c "npm run start"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    expose: ["3000"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "127.0.0.1:3000:3000"
    volumes:
       - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
       - .:/var/www/hhps:ro
    depends_on:
       - frontend

