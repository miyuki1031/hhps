server {
    listen 80;
    server_name localhost;

    # メンテナンスページのルートディレクトリ（HTMLや画像が置いてある場所）
    root /var/www/hhps;

    # ① 静的ファイル（画像・CSS・JSなど）の処理
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
        # 1. まずNginxのルート（/var/www/hhps）にファイルがあるか探す
        # 2. なければ通常通り Next.js（@proxy）側へ探しに行かせる
        try_files $uri @proxy;
        
        access_log off;
        expires max;
    }
    # ② maintenance.html 自体への直接アクセスもNginxがその場で返す
    location = /maintenance.html {
        try_files /maintenance.html =404;
    }
    # ③ それ以外の一般的なアクセス（メインのルーティング）
    location / {
        # メンテ用のHTMLがあればそれを返し、なければ @proxy（Next.js） へ流す
        try_files /maintenance.html @proxy;
    }

     # 通常時用のNext.jsプロキシ（独立したブロック）
    location @proxy {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    # ④ 503エラーが発生した時に表示する画面を指定
    error_page 503 /maintenance.html;
}

# --- 2. 確認・更新作業用（3000ポート：コンテンツをそのまま常時表示） ---
server {
    listen 3000;
    server_name localhost;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    location /_next/webpack-hmr {
        proxy_pass http://frontend:3000/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        #proxy_set_header Host $host;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 💡 タイムアウトで切断されるのを防ぐ（Turbopackの生存維持用）
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    }
}

