server {
    listen 80;
    server_name localhost;

    # メンテナンス中のHTMLファイルのパス
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        #root /var/www/; # HTMLファイルの配置場所
        root /home/mizaya/dev_hsl/
        internal;
    }

    # 全てのリクエストを503エラーにする
    location / {
        return 503;
    }


