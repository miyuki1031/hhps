server {
    listen 80;
    server_name localhost;

    # メンテナンスページのルートディレクトリ（HTMLや画像が置いてある場所）
    root /var/www/hhps;

    # ① 静的ファイル（画像・CSS・JSなど）はNext.jsに流さずNginxが直接返す
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
        # ここでもメンテ判定を行う
        set $maintenance "";
        if (-f $document_root/maintenance.html) {
            set $maintenance "O";
        }
        if (-f $document_root/img_maintenance.png) {
            set $maintenance "O";
        }
        # メンテ中（"O"）の場合は、Next.jsに流さず「Nginxのルート（/var/www/hhps）」を見に行かせる
        # ※ ifの中で try_files が使えないため、メンテ用の内部 location へ break で飛ばします
        if ($maintenance = "O") {
            error_page 418 = @maintenance_assets;
            return 418;
        }
        # 通常時は、Next.js（frontend:3000）へリバースプロキシしてファイルを取ってくる
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
    }
# 【重要】①の外側に、完全に独立したブロックとして単体で置く！
    location @maintenance_assets {
        root /var/www/hhps;
        try_files $uri =404;
        access_log off;
        expires max;
    }
    # ② maintenance.html 自体への直接アクセスもNginxがその場で返す
    location = /maintenance.html {
        try_files /maintenance.html =404;
    }

    # ③ それ以外の一般的なアクセス（メインのルーティング）
    location / {
        # フラグの判定（どちらかのファイルがあればメンテモード）
        set $maintenance "";
        if (-f $document_root/maintenance.html) {
            set $maintenance "O";
        }
        if (-f $document_root/img_maintenance.png) {
            set $maintenance "O";
        }

        # メンテナンス中（"O"）であれば、503エラーを発生させて蓋絵へ飛ばす
        if ($maintenance = "O") {
            return 503;
        }
        
        # 通常時はNext.js（frontend:3000）へリバースプロキシ
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ④ 503エラーが発生した時に表示する画面を指定
    error_page 503 /maintenance.html;
}

# --- 2. 確認・更新作業用（3000ポート：コンテンツをそのまま常時表示） ---
server {
    listen 3000;
    server_name localhost;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

